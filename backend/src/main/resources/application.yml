spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/esun_db}
    username: ${DB_USERNAME:esun_user}
    password: ${DB_PASSWORD:esun_pass}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

logging:
  level:
    com.esun: DEBUG
    org.springframework.jdbc: DEBUG
