version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: esun-postgres
    environment:
      POSTGRES_DB: esun_db
      POSTGRES_USER: esun_user
      POSTGRES_PASSWORD: esun_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U esun_user -d esun_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
